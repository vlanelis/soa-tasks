services:
  flight-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  booking-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-replica:
    image: redis:latest
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master

  redis-sentinel:
    image: redis:latest
    container_name: redis-sentinel
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    command: >
      sh -c "cp /usr/local/etc/redis/sentinel.conf /tmp/sentinel.conf &&
             chmod 666 /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"

  flight-service:
    build:
      context: .
      dockerfile: flight_service/Dockerfile
      additional_contexts:
        - proto=./proto
    environment:
      DB_URL: postgresql://postgres:postgres@flight-db:5432/flight
      SERVICE_API_KEY: secret-service-key
      REDIS_SENTINEL_HOST: redis-sentinel
      REDIS_SENTINEL_PORT: "26379"
      REDIS_MASTER_NAME: mymaster
    depends_on:
      flight-db:
        condition: service_healthy
      redis-master:
        condition: service_started
      redis-replica:
        condition: service_started
      redis-sentinel:
        condition: service_started
    ports:
      - "50051:50051"
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "/bin/grpc_health_probe", "-addr=:50051" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  booking-service:
    build:
      context: .
      dockerfile: booking_service/Dockerfile
    environment:
      DB_URL: postgresql://postgres:postgres@booking-db:5432/booking
      FLIGHT_GRPC_TARGET: flight-service:50051
      SERVICE_API_KEY: secret-service-key
    depends_on:
      booking-db:
        condition: service_healthy
      redis-master:
        condition: service_started
      redis-replica:
        condition: service_started
      redis-sentinel:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  postgres-exporter-flight:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@flight-db:5432/flight?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - flight-db

  postgres-exporter-booking:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@booking-db:5432/booking?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      - booking-db

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis-master:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis-master

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
