openapi: 3.1.0

info:
  title: Marketplace API
  description: Simple marketplace API
  version: 1.0.0

servers:
  - url: http://localhost:8080/
    description: Локальный сервер

tags:
  - name: Products
    description: Управление товарами
  - name: Orders
    description: Управление заказами
  - name: PromoCodes
    description: Управление промокодами
  - name: Auth
    description: Регистрация и аутентификация

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT токен с role claim.
  schemas:
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Имя поля, в котором произошла ошибка.
        message:
          type: string
          description: Описание ошибки валидации для поля.
    StockIssue:
      type: object
      required:
        - product_id
        - requested_quantity
        - available_stock
      properties:
        product_id:
          type: integer
          format: int64
          description: Идентификатор товара.
        requested_quantity:
          type: integer
          minimum: 1
          description: Запрошенное количество.
        available_stock:
          type: integer
          minimum: 0
          description: Фактический остаток на складе.
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Машиночитаемый код ошибки.
          enum:
            - PRODUCT_NOT_FOUND
            - PRODUCT_INACTIVE
            - ORDER_NOT_FOUND
            - ORDER_LIMIT_EXCEEDED
            - ORDER_HAS_ACTIVE
            - INVALID_STATE_TRANSITION
            - INSUFFICIENT_STOCK
            - PROMO_CODE_INVALID
            - PROMO_CODE_MIN_AMOUNT
            - ORDER_OWNERSHIP_VIOLATION
            - VALIDATION_ERROR
            - ACCESS_DENIED
            - TOKEN_EXPIRED
            - TOKEN_INVALID
            - REFRESH_TOKEN_INVALID
            - AUTHENTICATION_FAILED
        message:
          type: string
          description: Человекочитаемое описание ошибки.
        details:
          type: object
          description: Дополнительные данные об ошибке.
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            stock_issues:
              type: array
              items:
                $ref: '#/components/schemas/StockIssue'
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    ProductCreate:
      type: object
      required:
        - name
        - price
        - stock
        - category
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: double
          minimum: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          description: Доступно только пользователям с ролью ADMIN.
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: double
          minimum: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          description: Доступно только пользователям с ролью ADMIN.
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор товара.
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          description: ID продавца, создавшего товар.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
    OrderItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    OrderItemResponse:
      type: object
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        price_at_order:
          type: number
          format: double
    OrderCreateRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
          nullable: true
    OrderUpdateRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        total_amount:
          type: number
          format: double
        discount_amount:
          type: number
          format: double
        promo_code_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PromoCodeType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]
    PromoCodeCreateRequest:
      type: object
      required:
        - code
        - discount_type
        - discount_value
        - valid_from
        - valid_until
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/PromoCodeType'
        discount_value:
          type: number
          format: double
          minimum: 0.01
        min_order_amount:
          type: number
          format: double
          default: 0
        max_uses:
          type: integer
          default: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true
    PromoCodeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/PromoCodeType'
        discount_value:
          type: number
          format: double
        min_order_amount:
          type: number
          format: double
        max_uses:
          type: integer
        current_uses:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
    UserRole:
      type: string
      enum: [USER, SELLER, ADMIN]
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Время жизни access token в секундах.
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

  responses:
    ValidationError:
      description: Ошибка валидации входных данных.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccessDenied:
      description: Доступ запрещён.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Не авторизован или токен невалиден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт бизнес-логики.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - bearer: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Пользователь успешно зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
      security: []

  /auth/login:
    post:
      tags: [Auth]
      summary: Аутентификация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токен успешно обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []

  /products:
    get:
      tags: [ Products ]
      summary: Получить список товаров с пагинацией и фильтрацией
      x-roles:
        allowed: [USER, SELLER, ADMIN]
        description: Все роли имеют доступ ко всем товарам
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Номер страницы (начиная с 0)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
          description: Размер страницы
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
          description: Фильтр по статусу
        - name: category
          in: query
          schema:
            type: string
          description: Фильтр по категории (точное совпадение)
      responses:
        '200':
          description: Успешный ответ со списком товаров и информацией о пагинации
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductResponse'
                    description: Список товаров на текущей странице
                  totalElements:
                    type: integer
                    format: int64
                    description: Общее количество элементов
                  currentPage:
                    type: integer
                    description: Номер текущей страницы
                  pageSize:
                    type: integer
                    description: Размер страницы
                  totalPages:
                    type: integer
                    description: Общее количество страниц
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      summary: Создать новый товар
      x-roles:
        allowed: [SELLER, ADMIN]
        description: |
          SELLER - может создавать товары
          ADMIN - может создавать товары для любого продавца
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Товар успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'

  /products/{id}:
    get:
      tags: [Products]
      summary: Получить товар по ID
      x-roles:
        allowed: [USER, SELLER, ADMIN]
        description: Все роли имеют доступ к любому товару
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Товар найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Обновить товар
      x-roles:
        allowed: [SELLER, ADMIN]
        description: |
          SELLER - может обновлять только свои товары
          ADMIN - может обновлять любые товары
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Мягкое удаление товара (перевод в ARCHIVED)
      x-roles:
        allowed: [SELLER, ADMIN]
        description: |
          SELLER - может удалять только свои товары
          ADMIN - может удалять любые товары
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Товар успешно архивирован (мягкое удаление).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [Orders]
      summary: Создать новый заказ
      x-roles:
        allowed: [USER, ADMIN]
        description: |
          USER - может создавать заказы только для себя
          ADMIN - может создавать заказы для любого пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: Заказ успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Conflict'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Получить заказ по ID
      x-roles:
        allowed: [USER, ADMIN]
        description: |
          USER - может просматривать только свои заказы
          ADMIN - может просматривать любые заказы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Заказ найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Orders]
      summary: Обновить существующий заказ (заменить позиции)
      x-roles:
        allowed: [USER, ADMIN]
        description: |
          USER - может обновлять только свои заказы
          ADMIN - может обновлять любые заказы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Заказ успешно обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Отменить заказ
      x-roles:
        allowed: [USER, ADMIN]
        description: |
          USER - может отменять только свои заказы
          ADMIN - может отменять любые заказы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Заказ успешно отменён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /promo-codes:
    post:
      tags: [PromoCodes]
      summary: Создать новый промокод
      x-roles:
        allowed: [SELLER, ADMIN]
        description: Продавцы и администраторы могут создавать промокоды
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreateRequest'
      responses:
        '200':
          description: Промокод успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
