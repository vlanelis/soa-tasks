services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s